<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignMed — Live Translator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/test.css') }}"
    />
  </head>
  <body class="test-body">
    <!-- NAVBAR -->
    <nav class="navbar navbar-dark">
      <div class="nav-container">
        <div class="nav-logo">
          <div class="logo-icon"><i class="fas fa-hands-helping"></i></div>
          <span>SignMed</span>
        </div>
        <ul class="nav-menu">
          <li><a href="/home" class="nav-link">Home</a></li>
          <li><a href="/test" class="nav-link active">Translator</a></li>
        </ul>
        <div class="live-badge"><span class="live-dot"></span> LIVE</div>
      </div>
    </nav>

    <!-- MAIN -->
    <main class="translator-main">
      <div class="translator-header">
        <h1>Real-Time Translator</h1>
        <p>Position your hands in frame and perform a sign</p>
      </div>

      <div class="translator-grid">
        <!-- VIDEO PANEL -->
        <div class="panel video-panel">
          <div class="panel-header">
            <span class="panel-title"
              ><i class="fas fa-camera"></i> Camera Feed</span
            >
            <span class="recording-badge"
              ><span class="rec-dot"></span> REC</span
            >
          </div>
          <div class="video-wrapper">
            <img
              id="video-feed"
              src="/video"
              alt="Video Feed"
              class="video-stream"
            />
            <div class="video-hint">
              <i class="fas fa-hand-paper"></i> Show both hands for best results
            </div>
          </div>
        </div>

        <!-- RESULTS PANEL -->
        <div class="results-panel">
          <!-- Detected Sign -->
          <div class="panel result-panel">
            <div class="panel-header">
              <span class="panel-title"
                ><i class="fas fa-sign-language"></i> Detected Sign</span
              >
            </div>
            <div class="sign-display">
              <div id="label" class="sign-label">
                <i class="fas fa-spinner fa-spin"></i> Waiting...
              </div>
            </div>
          </div>

          <!-- Confidence -->
          <div class="panel confidence-panel">
            <div class="panel-header">
              <span class="panel-title"
                ><i class="fas fa-chart-bar"></i> Confidence</span
              >
              <span id="accuracy" class="accuracy-text">0%</span>
            </div>
            <div class="conf-bar-track">
              <div
                id="accuracy-bar"
                class="conf-bar-fill"
                style="width: 0%"
              ></div>
            </div>
          </div>

          <!-- Sentence -->
          <div class="panel sentence-panel">
            <div class="panel-header">
              <span class="panel-title"
                ><i class="fas fa-comment-medical"></i> Generated Sentence</span
              >
            </div>
            <div id="sentence" class="sentence-output">
              <p class="placeholder-text">Waiting for sign language input...</p>
            </div>
          </div>

          <!-- Actions -->
          <div class="panel actions-panel">
            <button id="speak-btn" class="action-btn speak-btn">
              <i class="fas fa-volume-up"></i>
              <span>Speak Aloud</span>
            </button>
            <button id="clear-btn" class="action-btn clear-btn">
              <i class="fas fa-redo"></i>
              <span>Reset</span>
            </button>
            <a href="/home" class="action-btn home-btn">
              <i class="fas fa-home"></i>
              <span>Home</span>
            </a>
          </div>
        </div>
      </div>
    </main>

    <script src="{{ url_for('static', filename='JS/test.js') }}"></script>
  </body>
</html>
